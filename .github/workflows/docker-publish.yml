name: Publicar imagem Docker (GHCR)

# Quando a imagem e publicada:
#
# - push na "main"      -> tag :latest, que e a que o stack do Portainer puxa
# - push de tag vX.Y.Z  -> tags de versao, para conseguir voltar atras
# - push noutro ramo    -> tag com o nome do ramo (ex.: :feat-deploy-docker),
#   que permite testar a imagem no servidor ANTES do merge na main
# - manualmente         -> Actions > Publicar imagem Docker > Run workflow
on:
  pull_request:
    branches:
      - main
    types:
      - closed
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # O GITHUB_TOKEN e criado pelo proprio GitHub a cada execucao e some
      # depois. Nenhum segredo precisa ser cadastrado a mao: a imagem nao
      # recebe configuracao no build — dominio, banco, chave da Resend e
      # credencial da Efi entram so em runtime, pelo Portainer.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
